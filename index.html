<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>كيبورد Kuntulissi</title>
<style>
:root{--bg:#f4f6fa;--surface:#fff;--key:#fff;--text:#0f2a4a;--sub:#6b7a90;--line:#d3dae6;--accent:#0f2a4a;--accent-t:#fff;--sp:#e6ebf3;--sf:#c9d3e3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1420;--surface:#161f2e;--key:#2a3850;--text:#e8eef8;--sub:#9fb0c8;--line:#34455f;--accent:#4f8cff;--accent-t:#fff;--sp:#161f2e;--sf:#3a4c69;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;max-width:560px;margin-inline:auto;padding:10px}
h1{font-size:17px;margin:4px 2px 8px;text-align:center}
#out{direction:ltr;width:100%;flex:1;min-height:110px;resize:none;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--text);font-size:22px;padding:12px;font-family:inherit}
.bar{display:flex;gap:8px;margin:8px 0}
.bar button{flex:1;padding:11px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15px;font-family:inherit}
.bar button.p{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
#kb{direction:ltr;display:flex;flex-direction:column;gap:7px;padding:8px 4px;background:var(--sp);border-radius:14px;--kw:calc((100% - 36px)/10)}
.r{display:flex;justify-content:center;gap:4px}
.k{width:var(--kw);flex:0 0 var(--kw);background:var(--key);color:var(--text);border:1px solid var(--line);border-radius:7px;height:54px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;font-weight:700;font-family:inherit;line-height:1.1;touch-action:manipulation;user-select:none}
.k small{font-size:9px;font-weight:400;color:var(--sub);margin-top:2px}
.k:active{background:var(--accent);color:var(--accent-t)}
.k:active small{color:var(--accent-t)}
.k.f{background:var(--sf);font-size:18px}
.k.x{width:calc(var(--kw)*1.5);flex-basis:calc(var(--kw)*1.5)}
.k.sp{width:calc(var(--kw)*4.8);flex-basis:calc(var(--kw)*4.8);font-size:13px;font-weight:400}
.k.on{background:var(--accent);color:var(--accent-t)}
.hint{font-size:12px;color:var(--sub);text-align:center;margin:8px 4px 4px;line-height:1.7}
</style>
</head>
<body>
<h1>كيبورد Kuntulissi</h1>
<textarea id="out" placeholder="اكتب هنا…" inputmode="none" aria-label="النص"></textarea>
<div class="bar">
<button class="p" id="copy">نسخ النص</button>
<button id="share">مشاركة</button>
<button id="clear">مسح</button>
</div>
<div id="kb"></div>
<div class="hint">⇧ مرة واحدة: حرف كبير واحد · ⇧ مرتين بسرعة: تثبيت الحروف الكبيرة (Caps Lock) · ⇧ مرة أخرى: إلغاء.<br>لإضافته للموبايل: قائمة المتصفح ← «إضافة إلى الشاشة الرئيسية».</div>
<script>
(function(){
var IPA={A:"a",B:"b",DH:"ɖ",E:"e",F:"f",H:"h",I:"i",J:"dʒ",K:"k",L:"l",M:"m",N:"n",NG:"ɲ",O:"o",QH:"ŋ",R:"r~ɾ",S:"s",T:"t",TH:"ʈ",U:"u",W:"w",Y:"j"};
var ROWS=[["QH","W","E","R","T","TH","Y","U","I","O"],["A","S","DH","F","H","J","K","L"],["#shift","B","N","NG","M","#back"],[",",".","#space","?","!","#enter"]];
var out=document.getElementById("out"),kb=document.getElementById("kb"),state=1,last=0,keys=[],sk=null;
function ins(t){var s=out.selectionStart,e=out.selectionEnd,v=out.value;out.value=v.slice(0,s)+t+v.slice(e);out.selectionStart=out.selectionEnd=s+t.length;}
function back(){var s=out.selectionStart,e=out.selectionEnd,v=out.value;if(s!==e){out.value=v.slice(0,s)+v.slice(e);out.selectionStart=out.selectionEnd=s;}else if(s>0){out.value=v.slice(0,s-1)+v.slice(s);out.selectionStart=out.selectionEnd=s-1;}}
function render(){keys.forEach(function(k){k.el.firstChild.nodeValue=state?k.u:k.u.toLowerCase();});if(sk){sk.classList.toggle("on",state>0);sk.textContent=state===2?"⇪":"⇧";}}
function autoCap(){if(state===2)return;var b=out.value.slice(0,out.selectionStart);state=(b===""||/[.!?]\s+$/.test(b)||/\n$/.test(b))?1:0;render();}
function mk(row,label,cls,fn,sub){var b=document.createElement("button");b.type="button";b.className="k "+(cls||"");b.innerHTML=label+(sub?"<small>/"+sub+"/</small>":"");b.addEventListener("pointerdown",function(ev){ev.preventDefault();fn();});row.appendChild(b);return b;}
ROWS.forEach(function(r){
var row=document.createElement("div");row.className="r";kb.appendChild(row);
r.forEach(function(c){
if(c==="#shift"){sk=mk(row,"⇧","f x",function(){var t=Date.now();if(t-last<350&&state!==2){state=2;}else{state=state===0?1:0;}last=t;render();});}
else if(c==="#back"){mk(row,"⌫","f x",function(){back();autoCap();});}
else if(c==="#space"){mk(row,"space","f sp",function(){ins(" ");autoCap();});}
else if(c==="#enter"){mk(row,"↵","f",function(){ins("\n");autoCap();});}
else if(IPA[c]){var el=mk(row,c,"",function(){ins(state?c:c.toLowerCase());if(state===1)state=0;render();},IPA[c]);keys.push({el:el,u:c});}
else{mk(row,c,"f",function(){ins(c);autoCap();});}
});});
render();
function flash(id,t){var b=document.getElementById(id),o=b.textContent;b.textContent=t;setTimeout(function(){b.textContent=o;},1200);}
document.getElementById("copy").onclick=function(){var v=out.value;if(!v)return;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(function(){flash("copy","تم النسخ ✓");},function(){out.select();document.execCommand("copy");flash("copy","تم النسخ ✓");});};
document.getElementById("share").onclick=function(){if(navigator.share&&out.value){navigator.share({text:out.value}).catch(function(){});}else{flash("share","غير مدعوم");}};
document.getElementById("clear").onclick=function(){out.value="";state=1;render();};
})();
</script>
</body>
</html>
